<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1300" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="27" font-weight="800" fill="#1a1a1a">🔴 AI Red Teaming — Attack Surface</text>
  <text x="40" y="74" font-size="15" fill="#5f6368">The adversarial-ML attack surface this toolkit covers, mapped to the model pipeline (NIST AI 100-2)</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>

  <!-- ===== Central pipeline ===== -->
  <!-- Data store (cylinder) -->
  <g>
    <path d="M572,150 a78,20 0 0,0 156,0 l0,62 a78,20 0 0,1 -156,0 z" fill="#2b2b2b"/>
    <ellipse cx="650" cy="150" rx="78" ry="20" fill="#3a3a3a"/>
    <text x="650" y="250" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Training / Retrieved Data</text>
  </g>

  <!-- Deployed boundary -->
  <rect x="430" y="330" width="540" height="172" rx="10" fill="#fafafa" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="700" y="488" font-size="13" font-weight="600" fill="#5f6368" text-anchor="middle">Deployed model — or application (model · guardrails · RAG · tools)</text>

  <!-- Input / Model / Output -->
  <rect x="462" y="388" width="120" height="62" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="522" y="425" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Input</text>

  <rect x="622" y="388" width="156" height="62" rx="8" fill="#1f2933"/>
  <text x="700" y="415" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ML / AI</text>
  <text x="700" y="435" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Model</text>

  <rect x="818" y="388" width="120" height="62" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="878" y="425" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Output</text>

  <!-- pipeline arrows -->
  <line x1="582" y1="419" x2="620" y2="419" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="778" y1="419" x2="816" y2="419" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>
  <!-- data feeds input/context -->
  <path d="M620,212 C560,300 530,330 522,386" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- ===== Attack labels (all red, NB tag where built) ===== -->
  <g font-size="15" font-weight="700" fill="#C0392B">

    <!-- top: poisoning + indirect injection -->
    <text x="250" y="120">Data Poisoning · 📋 planned</text>
    <path d="M360,128 C460,150 520,140 574,150" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="800" y="112">Prompt Injection (indirect) · NB03 ✅</text>
    <text x="800" y="132" font-size="13" font-weight="400" fill="#7a3b32">malicious content in retrieved data</text>
    <path d="M795,120 C760,138 745,142 728,150" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- left: input-side attacks -->
    <text x="40" y="356">Prompt Injection (direct) · NB03 ✅</text>
    <path d="M250,364 C350,392 400,402 460,410" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="404">Jailbreak — safety bypass · NB02 ✅</text>
    <path d="M270,412 C360,418 410,420 460,420" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="600">Evasion — adversarial inputs · NB01 ✅</text>
    <path d="M180,588 C300,520 400,470 462,442" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="640">NLI reasoning robustness · NB05 ✅</text>
    <path d="M165,628 C300,560 405,485 462,448" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- right: output-side attacks -->
    <text x="992" y="300">Model Extraction · 📋 planned</text>
    <path d="M938,400 C965,360 975,330 988,308" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="992" y="372">Sensitive-data disclosure · NB06 ✅</text>
    <text x="992" y="392" font-size="13" font-weight="400" fill="#7a3b32">secrets · PII · memorization · RAG exfiltration</text>
    <path d="M938,412 C962,402 972,398 988,392" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="992" y="448">Agentic tool hijacking · NB07 ✅</text>
    <text x="992" y="468" font-size="13" font-weight="400" fill="#7a3b32">untrusted input → unsafe tool call</text>
    <path d="M938,428 C962,438 972,444 988,452" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="992" y="528">Membership Inference · 📋 planned</text>
    <path d="M938,440 C965,480 975,505 988,520" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>
  </g>

  <!-- ===== Footer notes ===== -->
  <line x1="40" y1="668" x2="1260" y2="668" stroke="#ECEFF1" stroke-width="1.5"/>
  <text x="40" y="690" font-size="13" fill="#5f6368"><tspan font-weight="700" fill="#37474F">Bias &amp; Fairness (NB04)</tspan> is a model harm, not a pipeline attack — covered as a separate responsible-AI axis.</text>
  <text x="40" y="710" font-size="13" fill="#5f6368"><tspan font-weight="700" fill="#37474F">Scope:</tspan> model-level by default; <tspan font-weight="700" fill="#C0392B">ApplicationTarget</tspan> extends every probe to the deployed application (system prompt · guardrails · RAG · tools).</text>
</svg>
