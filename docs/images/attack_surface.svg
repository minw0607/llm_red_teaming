<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1300" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="27" font-weight="800" fill="#1a1a1a">🔴 AI Red Teaming — Attack Surface</text>
  <text x="40" y="74" font-size="15" fill="#5f6368">The adversarial-ML attack surface this toolkit covers, mapped to the model / agent pipeline (NIST AI 100-2)</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>

  <!-- ===== Central pipeline ===== -->
  <!-- Data store (cylinder) -->
  <g>
    <path d="M572,150 a78,20 0 0,0 156,0 l0,62 a78,20 0 0,1 -156,0 z" fill="#2b2b2b"/>
    <ellipse cx="650" cy="150" rx="78" ry="20" fill="#3a3a3a"/>
    <text x="650" y="250" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Training / Retrieved Data</text>
  </g>

  <!-- Deployed boundary -->
  <rect x="430" y="320" width="560" height="222" rx="10" fill="#fafafa" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="710" y="530" font-size="13" font-weight="600" fill="#5f6368" text-anchor="middle">Deployed model — or agentic application (model · tools · guardrails · RAG)</text>

  <!-- Input / Model / Output -->
  <rect x="455" y="372" width="112" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="511" y="406" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Input</text>

  <rect x="600" y="372" width="160" height="58" rx="8" fill="#1f2933"/>
  <text x="680" y="396" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ML / AI Model</text>
  <text x="680" y="416" font-size="12" font-weight="400" fill="#b0bec5" text-anchor="middle">(or agent)</text>

  <rect x="800" y="372" width="112" height="58" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="856" y="406" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Output</text>

  <!-- Tools / Actions (agentic) -->
  <rect x="600" y="464" width="160" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="2" stroke-dasharray="0"/>
  <text x="680" y="484" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Tools / Actions</text>
  <text x="680" y="500" font-size="11" font-weight="400" fill="#5f6368" text-anchor="middle">email · files · web · payments</text>

  <!-- pipeline arrows -->
  <line x1="567" y1="401" x2="598" y2="401" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="760" y1="401" x2="798" y2="401" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>
  <!-- model <-> tools (agent loop, bidirectional) -->
  <line x1="680" y1="432" x2="680" y2="462" stroke="#333" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <!-- data feeds input/context -->
  <path d="M620,212 C560,300 525,335 512,370" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- ===== Attack labels (red; ✅ where built, plain text where planned) ===== -->
  <g font-size="15" font-weight="700" fill="#C0392B">

    <!-- top: poisoning + indirect injection -->
    <text x="300" y="120">Data Poisoning</text>
    <path d="M360,127 C460,150 520,142 572,151" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="800" y="112">Prompt Injection (indirect) · NB03 ✅</text>
    <text x="800" y="132" font-size="13" font-weight="400" fill="#7a3b32">malicious content in retrieved data</text>
    <path d="M795,120 C760,138 745,143 728,151" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- left: input-side attacks -->
    <text x="40" y="356">Prompt Injection (direct) · NB03 ✅</text>
    <path d="M250,362 C350,390 405,402 453,410" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="404">Jailbreak — safety bypass · NB02 ✅</text>
    <path d="M270,412 C360,418 410,420 453,420" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="610">Evasion — adversarial inputs · NB01 ✅</text>
    <path d="M175,598 C300,520 400,470 455,442" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="650">NLI reasoning robustness · NB05 ✅</text>
    <path d="M165,638 C300,560 405,485 455,448" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- right: output-side attacks -->
    <text x="992" y="324">Model Extraction</text>
    <path d="M912,392 C945,360 965,338 988,330" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="992" y="392">Sensitive-data disclosure · NB06 ✅</text>
    <text x="992" y="412" font-size="13" font-weight="400" fill="#7a3b32">secrets · PII · memorization · RAG exfiltration</text>
    <path d="M912,406 C945,400 965,398 988,400" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="992" y="470">Membership Inference</text>
    <path d="M912,422 C950,448 968,460 988,464" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- bottom: agentic tool hijacking → targets the TOOL/ACTION stage, not output -->
    <text x="470" y="612">Agentic tool hijacking → unsafe tool call · NB07 ✅</text>
    <path d="M700,600 C700,560 692,530 685,512" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>
  </g>

  <!-- ===== Footer notes ===== -->
  <line x1="40" y1="700" x2="1260" y2="700" stroke="#ECEFF1" stroke-width="1.5"/>
  <text x="40" y="722" font-size="13" fill="#5f6368"><tspan font-weight="700" fill="#37474F">Bias &amp; Fairness (NB04)</tspan> is a model harm, not a pipeline attack — covered as a separate responsible-AI axis.</text>
  <text x="40" y="742" font-size="13" fill="#5f6368"><tspan font-weight="700" fill="#37474F">Scope:</tspan> model-level by default; <tspan font-weight="700" fill="#C0392B">ApplicationTarget</tspan> extends every probe to the deployed application (system prompt · guardrails · RAG · tools).</text>
</svg>
