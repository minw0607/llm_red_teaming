<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1300" height="780" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="27" font-weight="800" fill="#1a1a1a">🔴 AI Red Teaming — Attack Surface</text>
  <text x="40" y="74" font-size="15" fill="#5f6368">The adversarial-ML attack surface this toolkit covers, mapped to the model / agent pipeline (NIST AI 100-2)</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>

  <!-- ===== Central pipeline ===== -->
  <!-- Data store (cylinder) -->
  <g>
    <path d="M572,150 a78,20 0 0,0 156,0 l0,60 a78,20 0 0,1 -156,0 z" fill="#2b2b2b"/>
    <ellipse cx="650" cy="150" rx="78" ry="20" fill="#3a3a3a"/>
    <text x="650" y="246" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Training / Retrieved Data</text>
  </g>

  <!-- Deployed boundary -->
  <rect x="415" y="320" width="600" height="250" rx="10" fill="#fafafa" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="700" y="556" font-size="13" font-weight="600" fill="#5f6368" text-anchor="middle">Deployed model — or agentic application (input · guardrails · agent · tools)</text>

  <!-- Input -->
  <rect x="440" y="384" width="118" height="64" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="499" y="410" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Input</text>
  <text x="499" y="430" font-size="10.5" font-weight="400" fill="#5f6368" text-anchor="middle">prompts · queries · documents</text>

  <!-- Guardrails gate -->
  <rect x="580" y="380" width="68" height="72" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="614" y="410" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Safety /</text>
  <text x="614" y="426" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Guardrails</text>

  <!-- Agent -->
  <rect x="672" y="372" width="160" height="86" rx="8" fill="#1f2933"/>
  <text x="752" y="402" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ML / AI Agent</text>
  <text x="752" y="422" font-size="11.5" font-weight="400" fill="#b0bec5" text-anchor="middle">reasoning · planning</text>

  <!-- Output -->
  <rect x="858" y="384" width="110" height="64" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="913" y="420" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Output</text>

  <!-- Tools / Actions (agentic) -->
  <rect x="672" y="488" width="160" height="46" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="752" y="508" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Tools / Actions</text>
  <text x="752" y="524" font-size="10.5" font-weight="400" fill="#5f6368" text-anchor="middle">email · files · web · payments</text>

  <!-- pipeline arrows -->
  <line x1="558" y1="416" x2="578" y2="416" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="648" y1="416" x2="670" y2="416" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="832" y1="416" x2="856" y2="416" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>
  <!-- agent <-> tools (agent loop, bidirectional) -->
  <line x1="752" y1="458" x2="752" y2="488" stroke="#333" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <!-- data feeds input/context -->
  <path d="M620,210 C560,300 525,345 505,382" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- ===== Attack labels (red; ✅ where built, plain text where planned) ===== -->
  <g font-size="15" font-weight="700" fill="#C0392B">

    <!-- top: poisoning + indirect injection -->
    <text x="300" y="118">Data Poisoning</text>
    <path d="M360,125 C460,148 520,142 572,151" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="800" y="110">Prompt Injection (indirect) · NB03 ✅</text>
    <text x="800" y="130" font-size="13" font-weight="400" fill="#7a3b32">malicious content in retrieved data</text>
    <path d="M795,118 C760,136 745,142 728,150" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- left: input + guardrails + reasoning -->
    <text x="40" y="350">Prompt Injection (direct) · NB03 ✅</text>
    <path d="M250,356 C340,378 395,390 438,400" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="404">Jailbreak — bypass safety / guardrails · NB02 ✅</text>
    <path d="M280,410 C420,360 540,360 596,378" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="624">Evasion — adversarial inputs · NB01 ✅</text>
    <path d="M175,612 C300,545 392,478 440,444" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="40" y="664">NLI reasoning robustness · NB05 ✅</text>
    <path d="M185,652 C360,585 545,470 672,438" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- right: output-side attacks -->
    <text x="1000" y="330">Model Extraction</text>
    <path d="M968,400 C988,368 996,348 1004,340" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="1000" y="402">Sensitive-data disclosure · NB06 ✅</text>
    <text x="1000" y="422" font-size="13" font-weight="400" fill="#7a3b32">secrets · PII · memorization · RAG exfiltration</text>
    <path d="M968,416 C986,412 996,410 1004,410" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <text x="1000" y="480">Membership Inference</text>
    <path d="M968,430 C988,456 996,468 1004,474" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>

    <!-- bottom: agentic tool hijacking → targets the TOOL/ACTION stage -->
    <text x="470" y="628">Agentic tool hijacking → unsafe tool call · NB07 ✅</text>
    <path d="M748,616 C750,585 751,556 752,536" fill="none" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ar)"/>
  </g>

  <!-- ===== Footer notes ===== -->
  <line x1="40" y1="720" x2="1260" y2="720" stroke="#ECEFF1" stroke-width="1.5"/>
  <text x="40" y="742" font-size="13" fill="#5f6368"><tspan font-weight="700" fill="#37474F">Bias &amp; Fairness (NB04)</tspan> is a model harm, not a pipeline attack — covered as a separate responsible-AI axis.</text>
  <text x="40" y="762" font-size="13" fill="#5f6368"><tspan font-weight="700" fill="#37474F">Scope:</tspan> model-level by default; <tspan font-weight="700" fill="#C0392B">ApplicationTarget</tspan> extends every probe to the deployed application (system prompt · guardrails · RAG · tools).</text>
</svg>
